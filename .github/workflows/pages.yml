name: Museum Radar Scout + Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run autonomous research agent
        continue-on-error: true
        run: python scripts/research_agent.py

      - name: Refresh verified opportunity data
        continue-on-error: true
        run: python scripts/scout_static.py

      - name: Persist substantive intelligence
        run: |
          git config user.name "museum-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json data/discovered-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist radar intelligence [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
