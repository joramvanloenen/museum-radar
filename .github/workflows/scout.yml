name: Museum Radar Verified Tender Scout

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/scout_static.py"
      - "data/scout-config.json"
      - "data/sources.json"
      - ".github/workflows/scout.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: museum-radar-verified-scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Scout code
        run: python -m py_compile scripts/scout_static.py

      - name: Refresh verified opportunity data
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/scout_static.py

      - name: Persist verified intelligence
        run: |
          git config user.name "museum-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json data/meta.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh verified radar intelligence"
            git push origin HEAD:main
          fi
